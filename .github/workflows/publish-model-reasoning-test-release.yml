name: Publish model reasoning test release

on:
  push:
    branches:
      - feature/model-quota-settings
    paths:
      - .github/workflows/publish-model-reasoning-test-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c9b7df0fc1b409e8c8fc1c259ed8910eae5beb0f
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install launcher dependencies
        run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Package Windows installer
        run: bun run --cwd launcher package:win
      - name: Create prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          $asset = Get-ChildItem "launcher/artifacts/*.exe" | Select-Object -First 1;
          gh release create "v2.2.11-feature-model-reasoning-test" $asset.FullName
          --repo $env:GITHUB_REPOSITORY
          --target "c9b7df0fc1b409e8c8fc1c259ed8910eae5beb0f"
          --title "GPT Web Codex 2.2.11 Model Reasoning Test"
          --notes "Feature test build. Includes proxy support, all Codex models (hidden models marked), model-aware reasoning selection, quota display, active Codex job monitoring, diagnostics, and zero-event startup watchdog recovery. Recent task history is removed from the Jobs page."
          --prerelease
