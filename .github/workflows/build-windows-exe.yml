name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows-exe.yml"
      - "launcher/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "bun.lock"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install launcher dependencies
        run: bun install --cwd launcher --frozen-lockfile

      - name: Install Electron binary
        shell: pwsh
        run: bun .\launcher\node_modules\electron\install.js

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Run launcher regression tests
        run: bun run --cwd launcher test

      - name: Run widget regression tests
        shell: pwsh
        run: |
          bun test --timeout 15000 tests/image-preview-ui.test.ts
          bun test --timeout 15000 tests/standalone-luna.test.ts --test-name-pattern "image"

      - name: Package Windows EXE
        run: bun run --cwd launcher package:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: gpt-web-codex-windows-exe
          path: launcher/artifacts/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.2.11-patched-1"
          $asset = Get-ChildItem "launcher/artifacts/*.exe" | Select-Object -First 1
          if (-not $asset) { throw "Windows installer was not found." }

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset.FullName --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "GPT Web Codex 2.2.11 Patched 1" --notes "Fixes ChatGPT conversation stack overflow and stale image preview restoration."
          }
