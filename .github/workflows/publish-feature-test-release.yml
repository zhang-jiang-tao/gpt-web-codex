name: Publish feature test release

on:
  push:
    branches:
      - feature/model-quota-settings
    paths:
      - .github/workflows/publish-feature-test-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 06fcb2689207ed9809e8868e32c55174a581b47b
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install launcher dependencies
        run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Package Windows installer
        run: bun run --cwd launcher package:win
      - name: Create prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          $asset = Get-ChildItem "launcher/artifacts/*.exe" | Select-Object -First 1;
          gh release create "v2.2.11-feature-watchdog-test" $asset.FullName
          --repo $env:GITHUB_REPOSITORY
          --target "06fcb2689207ed9809e8868e32c55174a581b47b"
          --title "GPT Web Codex 2.2.11 Feature Test"
          --notes "Test build from feature/model-quota-settings. Includes proxy support, model selection, quota display, Codex job monitoring, diagnostics, and zero-event startup watchdog recovery."
          --prerelease
