name: Feature no model check

on:
  push:
    branches:
      - feature/model-quota-settings
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-feature:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install launcher dependencies
        run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Root typecheck
        run: bun run typecheck
      - name: Root feature tests
        run: bun test tests/standalone-luna.test.ts --test-name-pattern "Codex invocation|zero-event Codex startup|same web session serializes jobs|Luna work summaries"
      - name: Launcher typecheck
        run: bun run launcher:typecheck
      - name: Launcher tests
        run: bun run launcher:test
      - name: Package Windows installer
        run: bun run --cwd launcher package:win
      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: gpt-web-codex-no-model-test
          path: launcher/artifacts/*.exe
          if-no-files-found: error
          retention-days: 7
