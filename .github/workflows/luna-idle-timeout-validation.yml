name: Luna Idle Timeout Validation

on:
  pull_request:
    branches: [fix/luna-live-state-sync-test]
    paths:
      - "src/standalone/luna-jobs.ts"
      - "src/standalone/types.ts"
      - "src/adapters/chatgpt-web/mcp-server.ts"
      - "tests/luna-idle-timeout.test.ts"
      - ".github/workflows/luna-idle-timeout-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run Luna idle timeout tests
        run: bun test tests/luna-idle-timeout.test.ts
