name: Publish no-model test release

on:
  push:
    branches:
      - feature/model-quota-settings
    paths:
      - .github/workflows/publish-no-model-test-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2a808d2c3a4e147903e343e1f85622c74ed38079
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install launcher dependencies
        run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Package Windows installer
        run: bun run --cwd launcher package:win
      - name: Replace obsolete feature prereleases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          foreach ($tag in @('v2.2.11-feature-model-reasoning-test','v2.2.11-feature-watchdog-test')) {
            gh release view $tag --repo $repo *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release delete $tag --repo $repo --cleanup-tag -y
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          $asset = Get-ChildItem 'launcher/artifacts/*.exe' | Select-Object -First 1
          gh release create 'v2.2.11-feature-quota-jobs-watchdog-test' $asset.FullName --repo $repo --target '2a808d2c3a4e147903e343e1f85622c74ed38079' --title 'GPT Web Codex 2.2.11 Quota Jobs Watchdog Test' --notes 'Test build without model selection. Includes proxy support, Codex quota display, active Codex job monitoring, diagnostics, and zero-event startup watchdog recovery.' --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
