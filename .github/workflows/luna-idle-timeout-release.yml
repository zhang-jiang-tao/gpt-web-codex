name: Luna Idle Timeout Test Release

on:
  push:
    branches:
      - feat/luna-idle-timeout
    paths:
      - ".github/workflows/luna-idle-timeout-release.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_TAG: "v2.2.11-luna-idle-timeout-test"
      RELEASE_TITLE: "GPT Web Codex 2.2.11 Luna Idle Timeout Test"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install launcher dependencies
        run: bun install --cwd launcher --frozen-lockfile

      - name: Install Electron binary
        shell: pwsh
        run: bun .\launcher\node_modules\electron\install.js

      - name: Typecheck
        run: bun run typecheck

      - name: Run Luna idle timeout regression tests
        run: bun test tests/luna-idle-timeout.test.ts

      - name: Run launcher regression tests
        run: bun run --cwd launcher test

      - name: Package Windows EXE
        run: bun run --cwd launcher package:win

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpt-web-codex-luna-idle-timeout-test-windows-exe
          path: launcher/artifacts/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish new prerelease without overwriting any existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists. Refusing to overwrite it."
          }

          $asset = Get-ChildItem "launcher/artifacts/*.exe" | Select-Object -First 1
          if (-not $asset) { throw "Windows installer was not found." }

          gh release create $env:RELEASE_TAG $asset.FullName `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TITLE `
            --prerelease `
            --notes "Test build for LUNA-IDLE-TIMEOUT-001. timeout_ms now acts as an inactivity timeout: active Codex stdout/stderr refreshes the timer, long-running active jobs are not terminated solely because total runtime exceeds the timeout, and codexluna_status exposes last_activity_at. Based on feat/luna-idle-timeout and validated on Windows, macOS, and Ubuntu."
