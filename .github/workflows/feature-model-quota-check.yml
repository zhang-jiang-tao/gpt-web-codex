name: Feature model quota check

on:
  push:
    branches:
      - feature/model-quota-settings
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-feature:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install launcher dependencies
        run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Root typecheck
        run: bun run typecheck
      - name: Root tests
        run: bun run test
      - name: Launcher typecheck
        run: bun run launcher:typecheck
      - name: Launcher tests
        run: bun run launcher:test
      - name: Launcher build
        run: bun run launcher:build
